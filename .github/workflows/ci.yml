name: Struktura repozytorium

on:
  push:
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sprawdź wymagane katalogi
        run: |
          for d in docs contracts engine android-app backend test-data tools; do
            test -d "$d" || { echo "Brak katalogu: $d"; exit 1; }
          done
          echo "Struktura repozytorium jest poprawna"

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zainstaluj walidator schematu
        run: pip install jsonschema

      - name: Testy schematu migawki ofert
        run: python -m unittest discover -s tools -v

      - name: Walidacja przykładowych i opublikowanych migawek
        run: python tools/validate_snapshots.py

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Kompilacja i testy silnika
        run: bash engine/build-and-test.sh

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Zaakceptuj licencje Android SDK (SDK jest już na maszynie)
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKM" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Zbuduj aplikację (APK do testów)
        run: gradle :android-app:assembleDebug --no-daemon --stacktrace

      - name: Zapisz APK do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: lokaty-debug-apk
          path: android-app/build/outputs/apk/debug/*.apk
